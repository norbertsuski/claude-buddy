[package]
name = "claude-buddy"
# Not the shipped version, and deliberately not kept in step with one. The
# version users see comes from tauri.conf.json, which is what `chore: bump`
# moves along with package.json; no code reads CARGO_PKG_VERSION.
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "A floating always-on-top macOS widget for local Claude Code sessions."
authors = ["Norbert Suski"]
license = "MIT"
repository = "https://github.com/norbertsuski/claude-buddy"

[lib]
name = "claude_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
mac-notification-sys = "0.6"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
notify = "8"
libc = "0.2"
plist = "1"
dirs = "5"
anyhow = "1"
core-graphics = "0.24"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSScreen"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }

[package]
name = "claude-buddy"
# Not the shipped version, and deliberately not kept in step with one. The
# version users see comes from tauri.conf.json, which is what `chore: bump`
# moves along with package.json; no code reads CARGO_PKG_VERSION.
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "A floating always-on-top macOS widget for local Claude Code sessions."
authors = ["Norbert Suski"]
license = "MIT"
repository = "https://github.com/norbertsuski/claude-buddy"

[lib]
name = "claude_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The provider-agnostic half of this widget. Tag-pinned: a core change is a
# tag there and a bump here, deliberately, so this app never moves under its
# own feet. For local work against a sibling clone, scripts/dev-core.sh writes
# a gitignored .cargo/config.toml that patches this to a path.
buddy-core = { git = "https://github.com/norbertsuski/buddy-core", tag = "v0.1.0" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
notify = "8"
libc = "0.2"
dirs = "5"
anyhow = "1"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSScreen"] }
objc2-foundation = { version = "0.3", features = ["NSAttributedString", "NSDictionary", "NSGeometry", "NSString"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
